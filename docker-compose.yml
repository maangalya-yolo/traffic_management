services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic-management-backend
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: traffic_management
      DB_USERNAME: traffic_app
      DB_PASSWORD: change-me
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: traffic-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: traffic_management
      POSTGRES_USER: traffic_app
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
