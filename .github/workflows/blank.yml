name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      # 1. Get project source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Check Java and Maven
      - name: Check environment
        run: |
          java -version
          mvn -version

      # 4. Build and run automated tests
      - name: Build and test
        run: mvn -B clean test

      # 5. Create Spring Boot JAR
      - name: Package application
        run: mvn -B package -DskipTests

      # 6. Upload generated JAR as workflow evidence
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-city-traffic-backend
          path: target/*.jar
